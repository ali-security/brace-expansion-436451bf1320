name: seal-build

on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '9.0.0'
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: brace-expansion-1.1.11
          path: brace-expansion-1.1.11.tgz
          if-no-files-found: error
